name: C++ CI Serial Programs Windows Default
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  build:
    if: github.event_name != 'pull_request' || 
      (github.event.pull_request.draft == false && !(github.event.action == 'edited' && github.event.changes.base != null))
    uses: ./.github/workflows/cpp-ci-serial-programs-base.yml
    with:
      os: windows-2025
      compiler: default
      upload-build: true
      run-tests: true
